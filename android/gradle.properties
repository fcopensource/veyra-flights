org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
# Compile Kotlin inside the Gradle process: one Java process instead of two, so it builds on 8-16 GB machines.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true

# Where the app finds the Veyra Flights server.
# Debug builds on the Android emulator reach the server on this computer at 10.0.2.2.
veyraApiUrlDebug=http://10.0.2.2:8787
# Release builds (the Play Store app) need the server's public https address.
veyraApiUrlRelease=https://flights-api.veyraeditor.com
